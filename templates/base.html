<!doctype html>
<html>
    <head>
        <title>Examination Management Portal</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet.">
        <link rel ="stylesheet" href ="{{url_for('static',filename='css/style.css')}}">


    </head>
    <body class= "bg-light">
        <nav class = "navbar navbar-dark bg-dark px-4">
            <a class = "navbar-brand fw-bold" href ="{{url_for('admin_dashboard')}}">
                Examiantion Portal </a>
                {% if session.get("username")%}
                <div class = "d-flex align-items-center  gap-3">
                    <span class = "text-white">{{session.get("username")}}
                    </span>
                    <form method="POST" action={{url_for("logout")}}>
                        <button type= "submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </div>
                {% endif %}
            </nav> 

            <div class =" container-fluid">
                <div class = "row">
                    {% if session.get("role")=="admin" %}
                    <aside class="col-md-3 col-lg-2 bg-white border-end min-vh-100 p-3">
                        <h6 class ="text-secondary text-uppercase mb-3">Administration</h6>
                        <nav class = "nav flex-column gap-2">
                            <a class = "nav-link" href ="{{url_for("admin_dashboard")}}">
                                Dashboard</a>
                                <a class ="nav-link" href="#">Manage Examiners</a>
                                <a class="nav-link" href ="#">Manage Students</a>
                                <a class = "nav-link" href ="#">Manage Courses</a>
                            </nav>
                        </aside>
                        {% endif %}
                        <main class = "{% if session.get("role")=="admin" %} col-md-9 col-lg-10{% else %} col-12{% endif %} p-4">
                            {% block content %}
                             {% endblock %}
                        </main>
                    </div>
                </div>
                </body>
            </html>
